<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cozinha</title>
  <meta name="description" content="Painel da cozinha: acompanhe os pedidos em tempo real e atualize o preparo.">
  <meta name="theme-color" content="#14110F">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/cozinha.css">
</head>
<body data-tema="cozinha">
  <!-- Ícones SVG inline (traço de 2px, pontas arredondadas, cor herdada) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-talheres" viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2V2"/><path d="M6 2v20"/><path d="M20 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-alerta" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-relogio" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
    <symbol id="i-sino" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></symbol>
    <symbol id="i-sino-off" viewBox="0 0 24 24"><path d="M8.7 3A6 6 0 0 1 18 8a21.3 21.3 0 0 0 .6 5"/><path d="M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="m2 2 20 20"/></symbol>
    <symbol id="i-sair" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></symbol>
  </svg>

  <!-- Tela de login -->
  <main class="login" id="tela-login">
    <div class="login__cartao">
      <div class="login__marca">
        <div class="login__logo" aria-hidden="true"><svg class="icone icone--24"><use href="#i-talheres"/></svg></div>
        <h1 class="t-heading-sm">Cozinha</h1>
      </div>
      <form class="login__form" id="form-login" novalidate>
        <div class="campo">
          <label class="campo__rotulo" for="email">E-mail</label>
          <input class="campo__entrada" id="email" type="email" autocomplete="username" inputmode="email" required>
        </div>
        <div class="campo">
          <label class="campo__rotulo" for="senha">Senha</label>
          <input class="campo__entrada" id="senha" type="password" autocomplete="current-password" required>
        </div>
        <p class="login__erro" id="login-erro" role="alert" hidden>
          <svg class="icone icone--24" aria-hidden="true"><use href="#i-alerta"/></svg>
          <span id="login-erro-texto"></span>
        </p>
        <button type="submit" class="btn btn--primario btn--bloco" id="btn-entrar">Entrar</button>
      </form>
    </div>
  </main>

  <!-- Painel de operação -->
  <div id="tela-painel" hidden>
    <header class="cabecalho">
      <div class="cabecalho__loja">
        <h1 class="t-heading-sm cabecalho__nome" id="loja-nome">Cozinha</h1>
      </div>
      <div class="cabecalho__acoes">
        <span class="conexao" id="conexao" role="status">
          <span class="conexao__ponto" aria-hidden="true"></span>
          <span id="conexao-texto">Conectando…</span>
        </span>
        <button type="button" class="btn-cab" id="btn-som" aria-pressed="false">
          <svg class="icone" aria-hidden="true" id="btn-som-icone"><use href="#i-sino-off"/></svg>
          <span id="btn-som-texto">Som desligado</span>
        </button>
        <button type="button" class="btn-cab" id="btn-sair">
          <svg class="icone" aria-hidden="true"><use href="#i-sair"/></svg>
          Sair
        </button>
      </div>
    </header>

    <nav class="visoes" aria-label="Visões da cozinha">
      <button type="button" class="visao" id="visao-pedidos" data-vista="pedidos" aria-current="true">Pedidos</button>
      <button type="button" class="visao" id="visao-historico" data-vista="historico">Histórico do dia</button>
    </nav>

    <div class="aviso" id="aviso-erro" role="alert" hidden>
      <p class="aviso__texto">
        <svg class="icone icone--24" aria-hidden="true"><use href="#i-alerta"/></svg>
        <span id="aviso-erro-texto">Não foi possível carregar os pedidos.</span>
      </p>
      <button type="button" class="btn btn--secundario" id="btn-recarregar">Tentar de novo</button>
    </div>

    <!-- Vista: pedidos em andamento (4 colunas em tela larga; abas abaixo de 1100px) -->
    <section id="vista-pedidos" aria-label="Pedidos em andamento">
      <nav class="abas-status" id="abas-status" aria-label="Status dos pedidos">
        <button type="button" class="aba-status" id="aba-recebido" data-status="recebido" data-coluna="recebido" aria-current="true">
          <span class="aba-status__rotulo">Novos</span><span class="aba-status__cont num" id="aba-cont-recebido">0</span>
        </button>
        <button type="button" class="aba-status" id="aba-confirmado" data-status="confirmado" data-coluna="confirmado">
          <span class="aba-status__rotulo">Aceitos</span><span class="aba-status__cont num" id="aba-cont-confirmado">0</span>
        </button>
        <button type="button" class="aba-status" id="aba-em_preparo" data-status="em_preparo" data-coluna="em_preparo">
          <span class="aba-status__rotulo">Preparando</span><span class="aba-status__cont num" id="aba-cont-em_preparo">0</span>
        </button>
        <button type="button" class="aba-status" id="aba-pronto" data-status="pronto" data-coluna="pronto">
          <span class="aba-status__rotulo">Prontos</span><span class="aba-status__cont num" id="aba-cont-pronto">0</span>
        </button>
      </nav>

      <div class="colunas" id="colunas" aria-busy="true">
        <section class="coluna coluna--ativa" id="col-recebido" data-status="recebido" aria-labelledby="tit-recebido">
          <header class="coluna__topo"><h2 class="t-subheading" id="tit-recebido">Novos</h2><span class="coluna__contador num" id="cont-recebido">0</span></header>
          <div class="coluna__lista" id="lista-recebido"></div>
        </section>
        <section class="coluna" id="col-confirmado" data-status="confirmado" aria-labelledby="tit-confirmado">
          <header class="coluna__topo"><h2 class="t-subheading" id="tit-confirmado">Aceitos</h2><span class="coluna__contador num" id="cont-confirmado">0</span></header>
          <div class="coluna__lista" id="lista-confirmado"></div>
        </section>
        <section class="coluna" id="col-em_preparo" data-status="em_preparo" aria-labelledby="tit-em_preparo">
          <header class="coluna__topo"><h2 class="t-subheading" id="tit-em_preparo">Preparando</h2><span class="coluna__contador num" id="cont-em_preparo">0</span></header>
          <div class="coluna__lista" id="lista-em_preparo"></div>
        </section>
        <section class="coluna" id="col-pronto" data-status="pronto" aria-labelledby="tit-pronto">
          <header class="coluna__topo"><h2 class="t-subheading" id="tit-pronto">Prontos</h2><span class="coluna__contador num" id="cont-pronto">0</span></header>
          <div class="coluna__lista" id="lista-pronto"></div>
        </section>
      </div>
    </section>

    <!-- Vista: histórico do dia (somente leitura) -->
    <section class="historico" id="vista-historico" aria-label="Histórico do dia" hidden>
      <div class="resumo" id="historico-resumo"></div>
      <p class="historico__nota" id="historico-nota" hidden></p>
      <div class="historico__lista" id="historico-lista"></div>
    </section>
  </div>

  <!-- Confirmação de cancelamento -->
  <dialog class="dialogo" id="dlg-cancelar" aria-labelledby="dlg-titulo">
    <h2 class="t-heading-sm" id="dlg-titulo">Cancelar pedido <span id="dlg-numero"></span>?</h2>
    <p class="dialogo__texto">O pedido sairá da fila e não poderá ser reaberto.</p>
    <div class="dialogo__acoes">
      <button type="button" class="btn-cozinha btn-cozinha--secundario" id="dlg-voltar" autofocus>Voltar</button>
      <button type="button" class="btn-cozinha btn-cozinha--perigo" id="dlg-confirmar">Cancelar pedido</button>
    </div>
  </dialog>

  <!-- Mensagens (toasts) -->
  <div class="toasts" id="toasts"></div>

  <!-- Ordem importa: SDK → cliente → lógica -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="supabase-client.js"></script>
  <script src="cozinha.js"></script>
</body>
</html>
